[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-dast"
version = "0.1.0"
description = "Sentinel DAST - unified, license-governed dynamic application security testing platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LicenseRef-Sentinel-Proprietary" }
authors = [{ name = "Sentinel DAST Engineering" }]
# Every runtime dependency below must also appear in
# third_party/inventory/third_party_inventory.yaml; `sentinel license check`
# fails the build otherwise.
dependencies = [
  "pydantic>=2.7,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "typer>=0.12,<1",
  "pyyaml>=6,<7",
  "httpx>=0.27,<1",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
]
postgres = ["psycopg[binary]>=3.1,<4"]

[project.scripts]
sentinel = "sentinel.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sentinel"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
